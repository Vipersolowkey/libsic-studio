openapi: 3.0.3
info:
  title: Libsic Studio API
  version: 0.1.0
  description: |
    REST API behind **Libsic Studio**, an ambient music room for the web. Visitors pick a layered scene,
    load a CD into a retro CD player and save the result as a *room* with a short share link.

    **Accounts are optional.** Anyone with a room's code can open it, and anyone can save a room without
    signing in. When a room is created, the API returns a secret **edit key** once. Changing or deleting the
    room needs that key in the `x-edit-key` header. Only a hash of the key is stored on the server.

    A visitor may also make an account (a username and a password, no email). Signing in gives a token that
    is sent as `Authorization: Bearer <token>`. Rooms and CDs saved while signed in belong to the account, so
    the owner can change or delete them from any device without the edit key. The edit key still works too.
    Tokens last 7 days. Passwords are stored only as a salted scrypt hash and are never sent back.

    Data is sent and received as JSON. Errors always look like `{ "error": "..." }`.

    **Fair use.** One visitor may send 300 requests per minute to the `/api` addresses. Above that the API
    answers `429 Too Many Requests` until the minute is over. Answers are sent compressed (gzip) to browsers
    that accept it.

    **Saving limits.** Saving is limited more strictly, per visitor: 40 saves or deletes per minute and
    60 new rooms or CDs per 10 minutes (answer `429`). When the free database is almost full, new rooms and
    CDs are refused with `503` until space is freed.

    **Sign-in limits.** Making accounts is limited to 30 per 15 minutes per visitor. Only *failed* sign-ins
    count: 10 per 15 minutes per visitor, and 5 per 15 minutes for one username (answer `429`).

    **Privacy.** There are no cookies. The only personal data kept for an account is the username, an
    optional display name and the password hash. Page visits are counted anonymously
    (`POST /api/visits`): only totals per day are kept, never addresses. "Do Not Track" is respected.
servers:
  - url: /
    description: This server
  - url: https://libsic-studio-api.onrender.com
    description: Live API
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Health
    description: Check that the server is running.
  - name: Scenes
    description: The layered scenes a room can use. Read only (scenes are loaded by a seed script).
  - name: Rooms
    description: Saved rooms. Anyone can open one, only the holder of the edit key can change or delete it.
  - name: Tracks
    description: Original CC0 music library.
  - name: CDs
    description: Official collections and editable custom mixes.
  - name: Accounts
    description: Optional accounts. Sign up, sign in and the signed-in person's own profile.
  - name: My things
    description: The signed-in person's own rooms and CDs, and moving guest rooms onto the account.
  - name: Admin
    description: Only for accounts with the admin role (made with `npm run make-admin`). Look at totals and remove spam.
  - name: Visits
    description: Anonymous visit counter (totals per day, no cookies, no addresses stored).

paths:
  # ---------------------------------------------------------------- Health
  /api/health:
    get:
      tags: [Health]
      summary: Check that the API is running
      operationId: getHealth
      responses:
        '200':
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ---------------------------------------------------------------- Scenes
  /api/scenes:
    get:
      tags: [Scenes]
      summary: List all scenes
      description: >-
        Returns the menu of scenes, sorted by name: only the slug, name and description of each one.
        The layers and clickable objects of a scene are sent by GET /api/scenes/{slug}, for the scene that is opened.
      operationId: listScenes
      responses:
        '200':
          description: The scenes (an empty list if none were seeded yet).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SceneSummary'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/scenes/{slug}:
    get:
      tags: [Scenes]
      summary: Get one scene
      operationId: getScene
      parameters:
        - $ref: '#/components/parameters/SceneSlug'
      responses:
        '200':
          description: The scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '404':
          $ref: '#/components/responses/SceneNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------- Rooms
  /api/rooms:
    post:
      tags: [Rooms]
      summary: Save a new room
      description: |
        Creates a room and returns it together with its share `code` and a secret `editKey`.
        **The edit key is shown only this once.** Keep it: it is the only way to change or delete the room.
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
            example:
              name: Late night reading
              sceneSlug: night-study
              settings:
                effect: rain
                lightOn: false
      responses:
        '201':
          description: The room was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServerFull'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/rooms/{code}:
    parameters:
      - $ref: '#/components/parameters/RoomCode'
    get:
      tags: [Rooms]
      summary: Open a room
      description: Anyone who knows the code can open the room. The edit key is never included.
      operationId: getRoom
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Rooms]
      summary: Change a room
      description: |
        Send only the fields you want to change; the others stay as they are.
        The room's code and edit key cannot be changed.
      operationId: updateRoom
      security:
        - EditKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
            example:
              name: Renamed room
              settings:
                lightOn: true
      responses:
        '200':
          description: The room after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/EditKeyMissing'
        '403':
          $ref: '#/components/responses/EditKeyWrong'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Rooms]
      summary: Delete a room
      description: Deletes the room for everyone. This cannot be undone.
      operationId: deleteRoom
      security:
        - EditKey: []
      responses:
        '204':
          description: The room was deleted. There is no response body.
        '401':
          $ref: '#/components/responses/EditKeyMissing'
        '403':
          $ref: '#/components/responses/EditKeyWrong'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/tracks:
    get:
      tags:
        - Tracks
      summary: List the original music library
      operationId: listTracks
      responses:
        "200":
          description: All tracks sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
        "500": &a1
          $ref: "#/components/responses/ServerError"
  /api/tracks/{id}:
    get:
      tags:
        - Tracks
      summary: Get one track
      operationId: getTrack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The track.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          description: Track not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": *a1
  /api/cds:
    get:
      tags:
        - CDs
      summary: List official CDs
      description: Custom CDs are accessible by code and are not listed on the public shelf.
      operationId: listCds
      responses:
        "200":
          description: Official CDs sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cd"
        "500": *a1
    post:
      tags:
        - CDs
      summary: Create a custom CD
      description: Select 1 to 30 distinct known track ids in playback order. The secret edit key is returned only
        on creation. Extra fields are ignored.
      operationId: createCd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CdInput"
      responses:
        "201":
          description: Created. Keep the edit key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCd"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServerFull"
        "500": *a1
  /api/cds/{code}:
    get:
      tags:
        - CDs
      summary: Open a shared CD
      operationId: getCd
      parameters:
        - &a2
          name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CD with tracks in playback order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cd"
        "404":
          description: CD not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": *a1
    put:
      tags:
        - CDs
      summary: Change a custom CD
      operationId: updateCd
      description: Send title and/or trackIds. Official CDs cannot be changed.
      parameters:
        - *a2
      security:
        - EditKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CdUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cd"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing edit key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong edit key or official CD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: CD not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": *a1
    delete:
      tags:
        - CDs
      summary: Delete a custom CD
      operationId: deleteCd
      description: Official CDs cannot be deleted. A room referencing a deleted CD still opens and lets its visitor
        choose another CD.
      parameters:
        - *a2
      security:
        - EditKey: []
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing edit key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong edit key or official CD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: CD not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": *a1

  /api/music/soundcloud/metadata:
    post:
      tags: [CDs]
      summary: Complete SoundCloud playlist track names
      operationId: getSoundcloudMetadata
      description: >-
        Resolves up to 50 numeric SoundCloud track ids through the provider's public oEmbed endpoint.
        At most four metadata lookups run concurrently; successful results are cached. Unavailable
        ids are omitted. The response contains text metadata only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    pattern: '^\d{1,20}$'
      responses:
        '200':
          description: Available track names and artist credits.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, artist]
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    artist:
                      type: string
        '400':
          description: Invalid ids or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/music/resolve:
    post:
      tags: [CDs]
      summary: Recognize a supported music link
      operationId: resolveMusicLink
      description: >-
        Returns a canonical source for SoundCloud, Spotify, YouTube or a direct HTTPS audio file.
        Provider short links on on.soundcloud.com and spotify.link are resolved with bounded redirects
        and timeouts. Arbitrary websites and final provider pages are never fetched by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2048
      responses:
        '200':
          description: Supported music source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicSource'
        '400':
          description: Unsupported URL, failed resolution, or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/visits:
    post:
      tags: [Visits]
      summary: Count one page view
      description: |
        Called by the website when a page opens. Nothing is stored about the visitor except that, once a day,
        a scrambled one-way mark is used to count each visitor once (it is deleted after 2 days).
        A request with the `DNT: 1` or `Sec-GPC: 1` header is accepted but not counted.
        Use `page: scene` with `scene` for a room being shown; scenes that do not exist are ignored.
      operationId: countVisit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page]
              properties:
                page:
                  type: string
                  enum: [home, new, room, cd, music, other, scene]
                scene:
                  type: string
                  description: "The scene slug, only with page = scene."
            example:
              page: scene
              scene: night-study
      responses:
        '204':
          description: Counted (or ignored because of Do Not Track).
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/stats:
    get:
      tags: [Visits]
      summary: Visit totals per day (owner only)
      description: |
        Needs the `STATS_TOKEN` of the server in the header `Authorization: Bearer <token>`.
        Answers `404` while no token is set on the server. A small page that shows these numbers is at `/stats`.
      operationId: getStats
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: One entry per day, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, example: '2026-11-26' }
                        visitors: { type: integer }
                        pages:
                          type: object
                          additionalProperties: { type: integer }
                        scenes:
                          type: object
                          additionalProperties: { type: integer }
        '401':
          description: The token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Stats are switched off (no `STATS_TOKEN` is set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- Accounts
  /api/auth/register:
    post:
      tags: [Accounts]
      summary: Make an account
      description: |
        Creates an account and signs it in. The username is 3 to 20 letters, numbers or underscores (it is
        saved in lower case). The password is 8 to 128 characters and must not be a very common password or
        the username. A `role` sent along is ignored: nobody can make themselves admin.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              username: night_owl
              password: correct horse battery
      responses:
        '201':
          description: The account was made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: That username is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/login:
    post:
      tags: [Accounts]
      summary: Sign in
      description: |
        A wrong username and a wrong password give the same answer, so nobody can find out which usernames exist.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Wrong username or password
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      tags: [Accounts]
      summary: Who am I
      description: Used when the website starts, to check that the saved token is still good.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Accounts]
      summary: Change my display name or disc colour
      description: Nothing else (username, password, role) can be changed here.
      operationId: updateMe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              displayName: Night Owl
              avatarHue: 210
      responses:
        '200':
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------- My things
  /api/me/rooms:
    get:
      tags: [My things]
      summary: My rooms
      description: The rooms owned by the signed-in account, newest first (at most 200).
      operationId: getMyRooms
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyRoom'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/me/cds:
    get:
      tags: [My things]
      summary: My CDs
      description: The custom CDs owned by the signed-in account, newest first (at most 200).
      operationId: getMyCds
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The CDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyCd'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/me/claim:
    post:
      tags: [My things]
      summary: Move guest rooms and CDs onto my account
      description: |
        Each room or CD needs its real edit key, so only the person who saved it can claim it. Anything that
        cannot be claimed is listed with a reason and nothing else changes. Safe to repeat. At most 50 entries.
      operationId: claimMine
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInput'
      responses:
        '200':
          description: What was moved and what was not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------- Admin
  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Totals
      operationId: adminStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Totals from our own database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/rooms:
    get:
      tags: [Admin]
      summary: Search all rooms
      operationId: adminRooms
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: One page of rooms (20 per page).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoomPage'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/rooms/{code}:
    parameters:
      - $ref: '#/components/parameters/RoomCode'
    delete:
      tags: [Admin]
      summary: Delete any room
      description: For spam. An admin can look and delete but not edit. Each delete is written to the server log.
      operationId: adminDeleteRoom
      security:
        - BearerAuth: []
      responses:
        '204':
          description: The room was deleted. There is no response body.
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/cds:
    get:
      tags: [Admin]
      summary: Search custom CDs
      description: Official CDs are not listed.
      operationId: adminCds
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: One page of CDs (20 per page).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCdPage'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/cds/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: The CD's share code.
        schema:
          type: string
    delete:
      tags: [Admin]
      summary: Delete a custom CD
      description: Official CDs cannot be deleted.
      operationId: adminDeleteCd
      security:
        - BearerAuth: []
      responses:
        '204':
          description: The CD was deleted. There is no response body.
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: No custom CD has that code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: CD not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List accounts
      description: Usernames and room counts only. Never any password data.
      operationId: adminUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: One page of accounts (20 per page).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '401':
          $ref: '#/components/responses/SignInNeeded'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "The token returned by sign up or sign in. Valid for 7 days. Sent only in this header, never in an address."
    EditKey:
      type: apiKey
      in: header
      name: x-edit-key
      description: The secret edit key returned when the room or custom CD was created.

  parameters:
    SearchText:
      name: q
      in: query
      required: false
      description: Search text (at most 60 characters). Used as plain text.
      schema:
        type: string
    PageNumber:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    SceneSlug:
      name: slug
      in: path
      required: true
      description: The scene's readable name in the address.
      schema:
        type: string
      example: night-study
    RoomCode:
      name: code
      in: path
      required: true
      description: The room's share code (the last part of its share link).
      schema:
        type: string
      example: k4m9x2qa

  responses:
    SignInNeeded:
      description: No valid token was sent, or it has expired. Sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Sign in first
    NotAdmin:
      description: The account is not an admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not allowed
    TooManyRequests:
      description: This visitor sent too many requests. Wait a minute (or a few minutes for new rooms and CDs) and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: You are saving too fast. Please wait a minute and try again.
    ServerFull:
      description: The database holds the most rooms or CDs it may. Try again later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request body is not valid JSON, or a value is not allowed. `details` names each field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error: Validation failed
            details:
              sceneSlug: Unknown scene "atlantis"
    EditKeyMissing:
      description: No edit key was sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Send the edit key in the x-edit-key header
    EditKeyWrong:
      description: The edit key does not belong to this room.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Wrong edit key
    SceneNotFound:
      description: No scene has that slug.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Scene not found
    RoomNotFound:
      description: No room has that code (it may have been deleted).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Room not found
    ServerError:
      description: Something went wrong on the server (for example the database is down).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Something went wrong on the server

  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_]+$'
          example: night_owl
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    User:
      type: object
      description: What the API says about a person. There is no id, email or password data.
      required: [username, displayName, avatarHue, role, createdAt]
      properties:
        username:
          type: string
        displayName:
          type: string
          maxLength: 30
        avatarHue:
          type: integer
          minimum: 0
          maximum: 359
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "Send it as `Authorization: Bearer <token>`. Valid for 7 days."
        user:
          $ref: '#/components/schemas/User'
    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 30
        avatarHue:
          type: integer
          minimum: 0
          maximum: 359
    MyRoom:
      type: object
      required: [code, name, sceneSlug, updatedAt]
      properties:
        code: { type: string }
        name: { type: string }
        sceneSlug: { type: string }
        updatedAt: { type: string, format: date-time }
    MyCd:
      type: object
      required: [code, title, updatedAt]
      properties:
        code: { type: string }
        title: { type: string }
        look:
          type: object
          nullable: true
          properties:
            hue: { type: integer, minimum: 0, maximum: 359 }
            cover: { type: integer, minimum: 0, maximum: 3 }
            disc: { type: integer, minimum: 0, maximum: 3 }
            font: { type: integer, minimum: 0, maximum: 4 }
        updatedAt: { type: string, format: date-time }
    ClaimEntry:
      type: object
      required: [code, editKey]
      properties:
        code: { type: string }
        editKey: { type: string }
    ClaimInput:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEntry'
        cds:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEntry'
    ClaimResult:
      type: object
      required: [claimed, skipped]
      properties:
        claimed:
          type: array
          items:
            type: object
            required: [type, code]
            properties:
              type: { type: string, enum: [room, cd] }
              code: { type: string }
        skipped:
          type: array
          items:
            type: object
            required: [type, code, reason]
            properties:
              type: { type: string, enum: [room, cd] }
              code: { type: string }
              reason:
                type: string
                enum: [invalid entry, not found, official CDs cannot be claimed, wrong edit key, already on another account]
    AdminStats:
      type: object
      required: [accounts, rooms, roomsThisWeek, customCds, officialCds, roomsPerScene]
      properties:
        accounts: { type: integer }
        rooms: { type: integer }
        roomsThisWeek: { type: integer }
        customCds: { type: integer }
        officialCds: { type: integer }
        roomsPerScene:
          type: array
          items:
            type: object
            required: [sceneSlug, rooms]
            properties:
              sceneSlug: { type: string }
              rooms: { type: integer }
    AdminRoomPage:
      type: object
      required: [total, page, pageSize, items]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [code, name, sceneSlug, owner, updatedAt]
            properties:
              code: { type: string }
              name: { type: string }
              sceneSlug: { type: string }
              owner: { type: string, nullable: true, description: "The owner's username, or null for a guest room." }
              updatedAt: { type: string, format: date-time }
    AdminCdPage:
      type: object
      required: [total, page, pageSize, items]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [code, title, owned, updatedAt]
            properties:
              code: { type: string }
              title: { type: string }
              owned: { type: boolean, description: "Whether an account owns it." }
              updatedAt: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [total, page, pageSize, items]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [username, displayName, role, createdAt, rooms]
            properties:
              username: { type: string }
              displayName: { type: string }
              role: { type: string, enum: [user, admin] }
              createdAt: { type: string, format: date-time }
              rooms: { type: integer }
    Track:
      type: object
      required:
        - id
        - title
        - artist
        - src
        - duration
        - license
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        src:
          type: string
          description: Audio path relative to the client origin. Audio is served by the client host.
        duration:
          type: number
          minimum: 1
          description: Duration in seconds.
        license:
          type: string
          example: CC0-1.0
    CdInput:
      type: object
      required:
        - title
      properties:
        title: &a1
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed; must contain a non-space character.
        trackIds: &a2
          type: array
          maxItems: 30
          description: Our own tracks. A CD holds either tracks or links, never both, and at least one of them.
          uniqueItems: true
          items:
            type: string
            minLength: 1
        links: &a3
          type: array
          maxItems: 12
          description: Online music (YouTube, SoundCloud, Spotify or a direct https audio file), played one after the other. Each entry is a link or an object with a `url`; the API stores the canonical link and works out the provider.
          items:
            type: string
        look:
          $ref: "#/components/schemas/CdLook"
    CdUpdate:
      type: object
      properties:
        title: *a1
        trackIds: *a2
        links: *a3
        look:
          type: object
          nullable: true
          description: Null (or left out) means the CD is painted from its code.
          properties: &lookprops
            hue: { type: integer, minimum: 0, maximum: 359 }
            cover: { type: integer, minimum: 0, maximum: 3 }
            disc: { type: integer, minimum: 0, maximum: 3 }
            font: { type: integer, minimum: 0, maximum: 4 }
    CdLook:
      type: object
      description: How the CD is painted. Only paint; the same numbers draw the same CD in every browser.
      required: [hue, cover, disc, font]
      properties:
        hue: { type: integer, minimum: 0, maximum: 359 }
        cover: { type: integer, minimum: 0, maximum: 3, description: "Pattern of the front cover" }
        disc: { type: integer, minimum: 0, maximum: 3, description: "Print on the disc" }
        font: { type: integer, minimum: 0, maximum: 4, description: "Lettering of the spine" }
    Cd:
      type: object
      required:
        - code
        - title
        - official
        - trackIds
        - links
        - tracks
        - createdAt
        - updatedAt
      properties:
        code:
          type: string
        title: *a1
        official:
          type: boolean
        trackIds: *a2
        links:
          type: array
          items:
            type: object
            required: [provider, url]
            properties:
              provider: { type: string, enum: [soundcloud, spotify, youtube, audio] }
              url: { type: string }
        look:
          type: object
          nullable: true
          properties: *lookprops
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        mine:
          type: boolean
          description: True when the signed-in caller owns this CD. Always false without a token.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatedCd:
      type: object
      required:
        - cd
        - editKey
      properties:
        cd:
          $ref: "#/components/schemas/Cd"
        editKey:
          type: string
          description: Secret. Store only in the creator browser; never include it in share links.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      required: [error, details]
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: object
          description: The message for each field that was not accepted, keyed by field name.
          additionalProperties:
            type: string

    Effect:
      type: string
      enum: [rain, snow, fireflies, stars, dust, bubbles, plankton, glitter]
      description: An animated weather or sky effect.

    SceneSummary:
      type: object
      description: One line of the scene menu. The full scene is read with GET /api/scenes/{slug}.
      required: [slug, name]
      properties:
        slug:
          type: string
          example: night-study
        name:
          type: string
          example: Rainy Night Study
        description:
          type: string
          example: A quiet desk above the city at night.

    Scene:
      type: object
      required: [slug, name, layers, objects, effects, effectLayer]
      properties:
        slug:
          type: string
          example: night-study
        name:
          type: string
          example: Rainy Night Study
        description:
          type: string
          example: A late-night café with a big window onto a rainy, neon-lit street.
        layers:
          type: array
          description: Transparent images stacked from far to near.
          items:
            $ref: '#/components/schemas/SceneLayer'
        objects:
          type: array
          description: Clickable objects in the scene.
          items:
            $ref: '#/components/schemas/SceneObject'
        effects:
          type: array
          description: The effects this scene can show.
          items:
            $ref: '#/components/schemas/Effect'
        defaultEffect:
          $ref: '#/components/schemas/Effect'
        effectLayer:
          type: integer
          minimum: 0
          description: Position in `layers` of the layer the effect is drawn on top of.
          example: 1
        nightDim:
          type: number
          minimum: 0
          maximum: 1
          description: How dark the whole picture gets when the lights are off. Leave it out for the usual dimming; a scene that paints its own night in layers can use a small number.
        surfaces:
          type: array
          description: The places where a visitor may put objects (for example the desk). Empty for a scene that cannot be decorated.
          items:
            $ref: '#/components/schemas/SceneSurface'
        catalog:
          type: array
          description: The objects a visitor may place in this scene. Empty for a scene that cannot be decorated.
          items:
            $ref: '#/components/schemas/CatalogEntry'

    SceneSurface:
      type: object
      description: |
        A place where objects can stand. Objects lower on the surface (larger `y`) look closer: they are drawn
        bigger and in front of the ones above them.
      required: [key, area, drawAt]
      properties:
        key:
          type: string
          example: desk
        area:
          type: object
          description: The contact point of an object must stay inside this box, in percent of the scene.
          required: [x, y, width, height]
          properties:
            x: { type: number, minimum: 0, maximum: 100 }
            y: { type: number, minimum: 0, maximum: 100 }
            width: { type: number, minimum: 0, maximum: 100 }
            height: { type: number, minimum: 0, maximum: 100 }
          example: { x: 2, y: 73, width: 96, height: 24 }
        blocked:
          type: array
          description: |
            Boxes where the contact point of an object may not be, for example the spot of a fixed object. A box
            may reach past the edge of `area` (then the way out on that side is closed). The editor pushes a dragged
            object out of a box to the nearest free edge. Omit it (or leave it empty) for a surface without such spots.
          items:
            type: object
            required: [x, y, width, height]
            properties:
              x: { type: number, minimum: 0, maximum: 100 }
              y: { type: number, minimum: 0, maximum: 100 }
              width: { type: number, minimum: 0, maximum: 100 }
              height: { type: number, minimum: 0, maximum: 100 }
          example: [{ x: 0, y: 60, width: 40, height: 27 }]
        drawAt:
          type: integer
          minimum: 0
          description: The objects of this surface are drawn just before this position in `layers`.
          example: 36
        perspective:
          type: object
          description: How big an object looks at the far and the near edge of the surface (1 is the size it was drawn at).
          properties:
            farY: { type: number, description: The y of the far edge. }
            nearY: { type: number, description: The y of the near edge. }
            farScale: { type: number, minimum: 0 }
            nearScale: { type: number, minimum: 0 }
          example: { farY: 73, nearY: 97, farScale: 0.8, nearScale: 1.25 }

    CatalogEntry:
      type: object
      description: One kind of object a visitor can place. Its pictures are the layers whose `item` is this `key`.
      required: [key, label, surface, home, bounds, thumb, scale]
      properties:
        key:
          type: string
          example: mug
        label:
          type: string
          example: Mug
        surface:
          type: string
          description: The `key` of the surface it stands on.
          example: desk
        home:
          type: object
          description: Where its contact point (bottom centre) sits in the original picture, in percent of the scene.
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        bounds:
          type: object
          description: The area the object covers at its home, in percent of the scene. This is what a visitor grabs.
          required: [x, y, width, height]
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
        thumb:
          type: string
          description: Picture shown in the tray.
          example: /scenes/night-study/c_mug.webp
        flippable:
          type: boolean
          description: False for objects with text on them, such as the clock.
        unique:
          type: boolean
          description: True when a room can hold at most one.
        inDefault:
          type: boolean
          description: True when the object is part of the starting arrangement.
        scale:
          type: object
          description: How small and how big a visitor may make it.
          required: [min, max]
          properties:
            min: { type: number, minimum: 0 }
            max: { type: number, minimum: 0 }

    SceneLayer:
      type: object
      required: [name, depth]   # `image` is needed for every layer except a clock
      properties:
        name:
          type: string
          example: city street
        image:
          type: string
          description: Path of the image file on the website.
          example: /scenes/night-study/l2_city.webp
        depth:
          type: number
          minimum: 0
          maximum: 1
          description: 0 is far away and hardly moves with the mouse, 1 is nearest and moves the most.
          example: 0.2
        kind:
          type: string
          enum: [image, clock]
          default: image
          description: A `clock` layer draws a live clock and needs no `image`.
        box:
          type: object
          description: Where the layer sits, in percent of the scene. Left out, the layer covers the whole scene.
          required: [x, y, width, height]
          properties:
            x: { type: number, minimum: 0, maximum: 100 }
            y: { type: number, minimum: 0, maximum: 100 }
            width: { type: number, minimum: 0, maximum: 100 }
            height: { type: number, minimum: 0, maximum: 100 }
        blend:
          type: string
          enum: [normal, screen, multiply]
          description: Use `screen` for glows, so they add light to what is below them, and `multiply` to darken them while keeping their colour (night shading).
        tile:
          type: number
          minimum: 1
          maximum: 100
          description: Repeat the picture side by side (for film grain). It is this wide, in percent of the layer.
        light:
          type: boolean
          description: True for lamp light and its glow. These layers fade out when the lights are switched off.
        glide:
          type: object
          required: [from, to, duration]
          description: |
            A slow trip across the scene that repeats, for a fish swimming by or a jellyfish drifting up. The layer fades in
            at `from`, moves in a straight line to `to` and fades out. It can be combined with `anim`.
          properties:
            from:
              type: object
              required: [x, y]
              description: "Where the trip starts, in percent of the layer's own width (x) and height (y). It may lie outside the layer."
              properties:
                x: { type: number, minimum: -2000, maximum: 2000 }
                y: { type: number, minimum: -2000, maximum: 2000 }
            to:
              type: object
              required: [x, y]
              description: Where the trip ends, in the same units as `from`.
              properties:
                x: { type: number, minimum: -2000, maximum: 2000 }
                y: { type: number, minimum: -2000, maximum: 2000 }
            duration: { type: number, minimum: 1, description: Seconds for one trip. }
            delay: { type: number, description: "Seconds before it starts; a negative number starts it part of the way along." }
            mirror: { type: boolean, description: Flip the picture (a fish drawn facing right that swims to the left). }
            pingpong: { type: boolean, description: "Drift to `to` and back again, smoothly, without fading out and starting over (a jellyfish hanging in the water). `duration` is then one way." }
        night:
          type: boolean
          description: True for a layer that is only shown at night (when the lights are off), such as the night sky in a window.
        curtain:
          type: object
          required: [scale, origin]
          description: |
            Marks the layer as a curtain. When the room's curtains are closed it is drawn `scale` times wider,
            growing out of the edge at `origin`.
          properties:
            scale: { type: number, minimum: 1, maximum: 4 }
            origin: { type: number, minimum: 0, maximum: 100, description: "Percent of the layer's own width that stays in place (0 = the left edge, 100 = the right edge)." }
        item:
          type: string
          description: |
            The `key` of the catalog object this layer belongs to. Such a layer is a template: it is drawn once
            for every copy of the object that a room places, instead of in its own place.
        mirror:
          type: boolean
          description: |
            Only for layers of an object. `false` means the picture is not mirrored when the object is flipped,
            so a shadow keeps falling away from the lamp.
        anim:
          type: object
          description: A small movement for this layer.
          required: [name]
          properties:
            name:
              type: string
              enum: [spin, tonearm, sway, steam, pulse, breathe, drift, flick, billow, throb, sweep, shut, cover]
            pivot:
              type: object
              description: The point it turns around, in percent of the layer's own picture.
              properties:
                x: { type: number }
                y: { type: number }
            duration: { type: number, minimum: 0.1, description: Seconds for one round. }
            delay: { type: number, description: Seconds before it starts. }
            squash: { type: number, minimum: 0.05, maximum: 1, description: "Spin: how flat the record looks. Shut and cover: how low the shell folds when the music is paused." }
            rest: { type: number, description: Tonearm only. Angle in degrees when the music is paused. }
            distance: { type: number, minimum: 0, maximum: 100, description: "Drift only. How far it travels, as a percent of the layer's width." }
            amplitude: { type: number, minimum: 0, maximum: 45, description: "Sway, billow and flick. How far it swings, in degrees." }
            skew: { type: number, description: Clock only. Tilt in degrees. }
            scaleFrom:
              type: object
              required: [x, y]
              description: Throb only. The width (x) and height (y) scale it starts at (1 is normal size).
              properties:
                x: { type: number, minimum: 0.2, maximum: 3 }
                y: { type: number, minimum: 0.2, maximum: 3 }
            scaleTo:
              type: object
              required: [x, y]
              description: Throb only. The scale it ends at.
              properties:
                x: { type: number, minimum: 0.2, maximum: 3 }
                y: { type: number, minimum: 0.2, maximum: 3 }

    SceneObject:
      type: object
      description: A clickable object. Position and size are percentages of the scene (0 to 100).
      required: [key, label, layer, x, y, width, height, action]
      properties:
        key:
          type: string
          example: jukebox
        label:
          type: string
          example: Jukebox
        layer:
          type: integer
          minimum: 0
          description: Position in `layers` of the layer the object is drawn on.
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        width: { type: number, minimum: 0, maximum: 100 }
        height: { type: number, minimum: 0, maximum: 100 }
        action:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [toggleLight, toggleEffect, toggleCurtains, nextTrack]
            effect:
              $ref: '#/components/schemas/Effect'
          description: What a click does. `effect` is given when the type is `toggleEffect`.

    RoomSettings:
      type: object
      properties:
        effect:
          type: string
          enum: [none, rain, snow, fireflies, stars, dust, bubbles, plankton, glitter]
          default: none
        lightOn:
          type: boolean
          default: true
          description: "False means night: the sunlight layers fade out and the layers made for the night come in."
        curtainsClosed:
          type: boolean
          default: false
        volume:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7

    MusicSource:
      type: object
      nullable: true
      required: [provider, url]
      additionalProperties: false
      description: >-
        An online music source. Only canonical public provider URLs or direct HTTPS audio links
        are stored. A non-null source replaces cdCode. Provider playback restrictions still apply.
      properties:
        provider:
          type: string
          enum: [soundcloud, spotify, youtube, audio]
        url:
          type: string
          format: uri
          maxLength: 2048

    Room:
      type: object
      required: [code, name, sceneSlug, cdCode, settings, items, createdAt, updatedAt]
      properties:
        code:
          type: string
          description: Share code, 8 characters.
          example: k4m9x2qa
        name:
          type: string
          maxLength: 60
          example: Late night reading
        sceneSlug:
          type: string
          example: night-study
        cdCode:
          type: string
          nullable: true
          description: The CD loaded in the CD player, if any.
        musicSource:
          $ref: '#/components/schemas/MusicSource'
        settings:
          $ref: '#/components/schemas/RoomSettings'
        items:
          $ref: '#/components/schemas/RoomItems'
        mine:
          type: boolean
          description: True when the signed-in caller owns this room. Always false without a token. The owner's id is never sent.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RoomItems:
      type: array
      nullable: true
      maxItems: 30
      description: |
        The objects the visitor placed. `null` means the scene's default arrangement. When a list is sent it
        replaces the whole list, so leaving an object out removes it. Moving a room to another scene without
        sending `items` sets them back to `null`.
      items:
        $ref: '#/components/schemas/RoomItem'

    RoomItem:
      type: object
      description: One object placed in a room. It must match an entry of the scene's catalog.
      required: [id, key, x, y, scale, flip]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,16}$'
          description: Unique inside the room.
          example: mug2
        key:
          type: string
          description: The `key` of a catalog entry of the room's scene.
          example: mug
        x:
          type: number
          description: Where the contact point (bottom centre) sits, in percent of the scene. Must stay inside the surface.
          example: 39
        y:
          type: number
          example: 87.3
        scale:
          type: number
          description: The visitor's own size on top of the perspective size. Limited by the catalog entry.
          example: 1
        flip:
          type: boolean
          description: Mirrored left to right. Only for entries that are `flippable`.

    RoomInput:
      type: object
      description: |
        The fields a visitor can set. When creating a room, `sceneSlug` is required.
        Any other field (such as `code`) is ignored.
      properties:
        name:
          type: string
          maxLength: 60
          default: Untitled room
        sceneSlug:
          type: string
          description: The slug of an existing scene.
        cdCode:
          type: string
          nullable: true
        musicSource:
          $ref: '#/components/schemas/MusicSource'
        settings:
          $ref: '#/components/schemas/RoomSettings'
        items:
          $ref: '#/components/schemas/RoomItems'

    RoomCreated:
      type: object
      required: [room, editKey]
      properties:
        room:
          $ref: '#/components/schemas/Room'
        editKey:
          type: string
          description: Secret needed to change or delete the room. Shown only once.
          example: I7Z0dp881g9oLOTQPfVr3x_DKoMIqnN-
