<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scene preview</title>
  <!-- Plain test page for the scene art. Open it by double-clicking the file.
       The data below is a copy of api/src/seed/scenes.js (layers and objects), for this preview only. -->
  <style>
    body { margin: 0; background: #0b0b10; color: #e8e8f0; font-family: system-ui, sans-serif; }
    header { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 12px; flex-wrap: wrap; }
    select, label { font-size: 15px; }
    .stage { position: relative; width: min(100vw, 1200px); aspect-ratio: 16 / 9; margin: 0 auto; overflow: hidden; background: #000; }
    .layer { position: absolute; inset: 0; will-change: transform; }
    .layer img { width: 100%; height: 100%; display: block; }
    .obj { position: absolute; border: 2px dashed rgba(255, 255, 255, 0.75); box-sizing: border-box; border-radius: 6px; cursor: pointer; }
    .obj span { position: absolute; left: 0; top: -22px; font-size: 12px; background: rgba(0,0,0,.7); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
    .hide-boxes .obj { border-color: transparent; }
    .hide-boxes .obj span { display: none; }
    p { text-align: center; opacity: .7; margin: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <label>Scene <select id="scene"></select></label>
    <label><input type="checkbox" id="boxes" checked /> Show clickable areas</label>
  </header>
  <div class="stage" id="stage"></div>
  <p>Move the mouse over the picture: near layers shift more than far ones.</p>

  <script>
    const SCENES = {
      'rainy-cafe': {
        name: 'Rainy Café', depths: [0.05, 0.2, 0.5, 0.9],
        objects: [
          { label: 'Window', layer: 2, x: 9.4, y: 12.2, width: 81.2, height: 53.3 },
          { label: 'Neon sign', layer: 2, x: 63.1, y: 15.6, width: 17.5, height: 12.2 },
          { label: 'Jukebox', layer: 3, x: 2.5, y: 44.4, width: 15.6, height: 48.9 },
        ],
      },
      'cozy-cabin': {
        name: 'Cozy Cabin', depths: [0.05, 0.2, 0.5, 0.9],
        objects: [
          { label: 'Window', layer: 2, x: 68.8, y: 15.6, width: 22.5, height: 36.7 },
          { label: 'Floor lamp', layer: 3, x: 25.9, y: 33.3, width: 8.2, height: 53.3 },
          { label: 'Record player', layer: 3, x: 8.1, y: 64.4, width: 16.2, height: 8.9 },
        ],
      },
      'moon-base': {
        name: 'Moon Base', depths: [0.05, 0.2, 0.5, 0.9],
        objects: [
          { label: 'Telescope', layer: 3, x: 26.9, y: 52.2, width: 15.6, height: 37.8 },
          { label: 'Beacon light', layer: 3, x: 6.2, y: 40.0, width: 8.1, height: 48.9 },
          { label: 'Comms radio', layer: 3, x: 76.9, y: 66.7, width: 16.2, height: 22.2 },
        ],
      },
    };

    const stage = document.getElementById('stage');
    const select = document.getElementById('scene');
    let layerEls = [];
    let depths = [];

    for (const [slug, s] of Object.entries(SCENES)) select.add(new Option(s.name, slug));

    function show(slug) {
      const scene = SCENES[slug];
      stage.innerHTML = '';
      depths = scene.depths;
      layerEls = depths.map((_, i) => {
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.innerHTML = `<img src="${slug}/layer-${i + 1}.svg" alt="" />`;
        scene.objects.filter((o) => o.layer === i).forEach((o) => {
          const box = document.createElement('div');
          box.className = 'obj';
          box.style.cssText = `left:${o.x}%;top:${o.y}%;width:${o.width}%;height:${o.height}%`;
          box.innerHTML = `<span>${o.label}</span>`;
          layer.appendChild(box);
        });
        stage.appendChild(layer);
        return layer;
      });
      move(0.5, 0.5);
    }

    function move(px, py) {
      const max = stage.clientWidth * 0.025; // biggest shift in pixels
      layerEls.forEach((el, i) => {
        const dx = -(px - 0.5) * 2 * max * depths[i];
        const dy = -(py - 0.5) * 2 * max * depths[i];
        el.style.transform = `translate(${dx}px, ${dy}px) scale(1.06)`;
      });
    }

    stage.addEventListener('mousemove', (e) => {
      const r = stage.getBoundingClientRect();
      move((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
    });
    select.addEventListener('change', () => show(select.value));
    document.getElementById('boxes').addEventListener('change', (e) => {
      stage.classList.toggle('hide-boxes', !e.target.checked);
    });
    show(select.value);
  </script>
</body>
</html>
